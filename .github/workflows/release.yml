name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Validate, version, publish, and release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(release):')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITACCESS_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate required secrets
        env:
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          GITACCESS_TOKEN: ${{ secrets.GITACCESS_TOKEN }}
        run: |
          if [ -z "$NPMJS_TOKEN" ]; then
            echo "NPMJS_TOKEN repository secret is required"
            exit 1
          fi
          if [ -z "$GITACCESS_TOKEN" ]; then
            echo "GITACCESS_TOKEN repository secret is required"
            exit 1
          fi

      - name: Configure Git identity
        run: |
          git config user.name "opensyntax-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run lint if available
        run: npm run lint --if-present

      - name: Run typecheck if available
        run: npm run typecheck --if-present

      - name: Run tests if available
        run: npm test --if-present

      - name: Run build if available
        run: npm run build --if-present

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITACCESS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
